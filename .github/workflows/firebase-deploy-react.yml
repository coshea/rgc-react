name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time, in merge order. A newer run waits for the current one,
# and a newer pending run replaces an older pending one (it deploys a later
# commit), so a backlog never leaves production on stale code.
concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  build_and_deploy-react:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          # Firebase CLI v14+ requires Node >=20; use Node 22 for compatibility
          node-version: "22"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Compute Sentry release name
        # Matches the semver release tag (v<version>) and keeps the SHA unique.
        run: echo "SENTRY_RELEASE=rgc-react@$(node -p "require('./package.json').version")+${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build
        env:
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}
          VITE_PAYPAL_ENVIRONMENT: ${{ secrets.VITE_PAYPAL_ENVIRONMENT }}
          VITE_FIREBASE_FUNCTIONS_BASE_URL: ${{ secrets.VITE_FIREBASE_FUNCTIONS_BASE_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_ENABLE_LOGS: ${{ secrets.VITE_SENTRY_ENABLE_LOGS }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RIDGEFIELD_GOLF_CLUB }}
          channelId: live
          projectId: ridgefield-golf-club

      - name: Mark Sentry release as deployed
        # Runs after the live deploy so Sentry's deploy time matches when
        # members actually got the new code.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ridgefield-golf-club
          SENTRY_PROJECT: rgc-react
        run: npx sentry-cli releases deploys "$SENTRY_RELEASE" new -e production
