name: Deploy Firebase Functions (TypeScript)

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install function dependencies
        working-directory: ./functions
        run: |
          npm ci

      - name: Run function unit tests
        working-directory: ./functions
        run: |
          npm test

      - name: Build functions
        working-directory: ./functions
        run: |
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RIDGEFIELD_GOLF_CLUB }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Cloud Functions
        # Secret values like PAYPAL_CLIENT_SECRET and GOOGLE_GENAI_API_KEY are stored in
        # Google Cloud Secret Manager and referenced via defineSecret() in the function
        # code. They are NOT passed as env vars here.
        #
        # Non-secret string params such as PAYPAL_CLIENT_ID and PAYPAL_ENVIRONMENT are
        # defined via defineString() in the function code and must be configured in the
        # Firebase functions parameter store (e.g. firebase functions:params:set).
        # The deployment service account still needs roles/secretmanager.viewer so the
        # Firebase CLI can verify any referenced Secret Manager secrets exist.
        run: |
          firebase deploy --only functions:rgc-react --project ridgefield-golf-club --non-interactive
