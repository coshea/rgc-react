name: Deploy Firebase Functions (TypeScript)

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install function dependencies
        working-directory: ./functions
        run: |
          npm ci

      - name: Run function unit tests
        working-directory: ./functions
        run: |
          npm test

      - name: Build functions
        working-directory: ./functions
        run: |
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        # Uses Application Default Credentials so the Firebase CLI and all
        # Google Cloud libraries pick up auth consistently. The service account
        # stored in FIREBASE_SERVICE_ACCOUNT_RIDGEFIELD_GOLF_CLUB must have the
        # following IAM roles on the ridgefield-golf-club project:
        #   - roles/firebase.admin  (or roles/cloudfunctions.admin + roles/iam.serviceAccountUser)
        #   - roles/datastore.user  (required: Firebase CLI checks the Firestore
        #                            database even when deploying only functions)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_RIDGEFIELD_GOLF_CLUB }}"

      - name: Compute Sentry release name
        # Same naming as the site's releases (root package.json version + SHA).
        run: echo "SENTRY_RELEASE=rgc-functions@$(node -p "require('./package.json').version")+${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Write non-secret function params to .env
        # VITE_PAYPAL_CLIENT_ID and VITE_PAYPAL_ENVIRONMENT are defineString() params (non-secret).
        # They must be available at deploy time. Store them as GitHub repository secrets
        # (VITE_PAYPAL_CLIENT_ID, VITE_PAYPAL_ENVIRONMENT) and they will be written here.
        # Alternatively, run `firebase functions:params:set` once locally instead and
        # remove this step — the CLI will read from the parameter store automatically.
        run: |
          echo "PAYPAL_CLIENT_ID=${{ secrets.VITE_PAYPAL_CLIENT_ID }}" >> functions/.env
          echo "PAYPAL_ENVIRONMENT=${{ secrets.VITE_PAYPAL_ENVIRONMENT }}" >> functions/.env
          # Functions report to the rgc-functions Sentry project. A DSN is not a
          # secret; it only allows sending events.
          echo "SENTRY_DSN=https://32d292c9243d768566cd5e355c81429e@o4510721156644864.ingest.us.sentry.io/4512255241027584" >> functions/.env
          echo "SENTRY_RELEASE=$SENTRY_RELEASE" >> functions/.env

      - name: Deploy Cloud Functions
        # Secret values (PAYPAL_CLIENT_SECRET, GOOGLE_GENAI_API_KEY, RESEND_API_KEY,
        # RESEND_WEBHOOK_SECRET) are
        # stored in Google Cloud Secret Manager and referenced via defineSecret() — they
        # are NOT passed here. Non-secret string params are supplied via functions/.env
        # above (or pre-set via `firebase functions:params:set`).
        run: |
          firebase deploy --only functions:rgc-react --project ridgefield-golf-club --non-interactive

      - name: Create Sentry release and mark it deployed
        # Runs after the deploy so Sentry's deploy time matches when the new
        # functions went live. Root dependencies aren't installed in this job,
        # so the CLI is pinned here to the version the site uses.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ridgefield-golf-club
          SENTRY_PROJECT: rgc-functions
        run: |
          npx --yes @sentry/cli@2.58.5 releases new "$SENTRY_RELEASE"
          npx --yes @sentry/cli@2.58.5 releases set-commits "$SENTRY_RELEASE" --auto --ignore-missing
          npx --yes @sentry/cli@2.58.5 releases finalize "$SENTRY_RELEASE"
          npx --yes @sentry/cli@2.58.5 releases deploys "$SENTRY_RELEASE" new -e production
