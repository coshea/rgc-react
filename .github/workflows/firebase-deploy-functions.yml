name: Deploy Firebase Functions (TypeScript)

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install function dependencies
        working-directory: ./functions
        run: |
          npm ci

      - name: Run function unit tests
        working-directory: ./functions
        run: |
          npm test

      - name: Build functions
        working-directory: ./functions
        run: |
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RIDGEFIELD_GOLF_CLUB }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Write non-secret function params to .env
        # VITE_PAYPAL_CLIENT_ID and VITE_PAYPAL_ENVIRONMENT are defineString() params (non-secret).
        # They must be available at deploy time. Store them as GitHub repository secrets
        # (VITE_PAYPAL_CLIENT_ID, VITE_PAYPAL_ENVIRONMENT) and they will be written here.
        # Alternatively, run `firebase functions:params:set` once locally instead and
        # remove this step — the CLI will read from the parameter store automatically.
        run: |
          echo "PAYPAL_CLIENT_ID=${{ secrets.VITE_PAYPAL_CLIENT_ID }}" >> functions/.env
          echo "PAYPAL_ENVIRONMENT=${{ secrets.VITE_PAYPAL_ENVIRONMENT }}" >> functions/.env

      - name: Deploy Cloud Functions
        # Secret values (PAYPAL_CLIENT_SECRET, GOOGLE_GENAI_API_KEY, RESEND_API_KEY) are
        # stored in Google Cloud Secret Manager and referenced via defineSecret() — they
        # are NOT passed here. Non-secret string params are supplied via functions/.env
        # above (or pre-set via `firebase functions:params:set`).
        run: |
          firebase deploy --only functions:rgc-react --project ridgefield-golf-club --non-interactive
